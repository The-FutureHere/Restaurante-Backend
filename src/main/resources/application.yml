# =====================================================================
# BrasaOS backend
# Padrao (sem perfil): Supabase (PostgreSQL), pelo Session pooler.
# Perfil "local": H2 em arquivo, para testar sem tocar no Supabase.
#   mvn spring-boot:run -Dspring-boot.run.profiles=local
# =====================================================================

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  jpa:
    open-in-view: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: false

app:
  registration:
    master-code: "${REGISTRATION_MASTER_CODE:HNW7J-SHQ9C-28AFM-Y6CMY}"
  jwt:
    secret: "${JWT_SECRET:YyggkpLBPIOxjxg4HV8iOBQNgKph-XCLCJLdXrBUJsTjB65K7gM8SF2fm2cUdXx9}"
    expiration-minutes: 480
  cors:
    origins: "${CORS_ORIGINS:https://restaurante-admin-frontend.vercel.app,https://restaurante-mobile-frontend.vercel.app,http://localhost:5173,http://localhost:5174}"

---
# Supabase (Session pooler, porta 5432). NAO use a porta 6543.
spring:
  config:
    activate:
      on-profile: "!local"
  datasource:
    url: "jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require"
    username: "postgres.axsfbinvpqafeihzvgkv"
    password: "Vf962596141"
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: app
        format_sql: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN

---
# Desenvolvimento local com H2
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/restaurant;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true