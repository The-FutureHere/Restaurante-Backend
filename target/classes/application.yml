server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/restaurant;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
app:
  jwt:
    secret: ${JWT_SECRET:uma-chave-local-de-desenvolvimento-com-no-minimo-32-bytes-123456}
    expiration-minutes: 480
  cors:
    origins: ${CORS_ORIGINS:https://restaurante-admin-frontend.vercel.app/,http://localhost:5174, http://localhost:5173}
---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/restaurant}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
